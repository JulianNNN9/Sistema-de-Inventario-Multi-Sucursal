spring:
  application:
    name: inventario
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optiplant}
    username: ${SPRING_DATASOURCE_USERNAME:optiplant}
    password: ${SPRING_DATASOURCE_PASSWORD:optiplant_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev_jwt_secret_change_me_0123456789_abcdefghij}
    expiration-hours: 8
