spring:
  application:
    name: inventario
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optiplant}
    username: ${SPRING_DATASOURCE_USERNAME:optiplant}
    password: ${SPRING_DATASOURCE_PASSWORD:optiplant_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # RNF-02: sin default hardcodeado a propósito. En docker-compose,
    # docker-entrypoint.sh siempre exporta JWT_SECRET (lo genera si falta);
    # fuera de Docker (p. ej. `mvn spring-boot:run`) hay que exportarlo a
    # mano, porque un fallback público aquí sería el mismo problema que se
    # corrigió en docker-compose.yml, solo movido a este archivo.
    secret: ${JWT_SECRET}
    expiration-hours: 8
